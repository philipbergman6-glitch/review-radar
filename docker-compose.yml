# Local "cluster" for the Big Data & AI final project.
# Memory-capped on purpose: this runs alongside Spark on a 16 GB laptop.
# Spark itself runs on the HOST (not containerised) so it can use the remaining RAM.
#
# Credentials come from .env (compose reads it automatically). `${VAR:?}` makes a
# missing value fail `docker compose up` loudly instead of starting with defaults.

services:

  # ---------------------------------------------------------------- Kafka ----
  # Single-broker KRaft mode (no ZooKeeper). Acts as the ingestion buffer that
  # decouples the producer from Spark Structured Streaming.
  kafka:
    image: apache/kafka:3.9.0
    container_name: bd-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    mem_limit: 2g

  # ----------------------------------------------------- MinIO object store ---
  # S3-compatible object store. Holds the Iceberg lakehouse (bronze/silver/gold).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: bd-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY missing from .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY missing from .env}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 1g

  # Creates the lakehouse bucket once MinIO is up, then exits.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: bd-minio-init
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
      S3_BUCKET: ${S3_BUCKET:-lakehouse}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      echo 'buckets ready'
      "
    restart: "no"

  # -------------------------------------------------------- Elasticsearch ----
  # Serving layer: document store + BM25 keyword search + dense_vector kNN.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: bd-es
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 2g

  # -------------------------------------------------------------- Postgres ---
  # Relational side of the project: product catalogue (OLTP-style, ACID).
  # Spark joins the streaming reviews against this via JDBC = SQL enrichment.
  postgres:
    image: postgres:16-alpine
    container_name: bd-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${PG_DB:-catalog}
      POSTGRES_USER: ${PG_USER:?PG_USER missing from .env}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD missing from .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./conf/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m

volumes:
  kafka-data:
  minio-data:
  es-data:
  pg-data:
