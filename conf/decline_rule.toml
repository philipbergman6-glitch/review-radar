# Decline rule configuration (ADR-0001, RR-09). Read by src/gold/rule.py.
#
# status = "provisional" : values are placeholders while the rule is developed on pre-2020
#                          data only; the gold job refuses to evaluate any point on or after
#                          holdout_start.
# status = "frozen"      : the protocol freeze. Set in one commit, after the calibration
#                          lines (placebo trigger rate, injected-decline power) are printed
#                          from pre-2020 data; never edited afterwards.
#
# The SHA-256 of this file's [rule] table is printed by every gold run and stored in the
# run ledger, so a changed rule is visible in lineage.

[rule]
status = "frozen"
holdout_start = "2020-01"          # first holdout evaluation point (month)

baseline_months = 6  # B: trailing window ending at the evaluation point
recent_months = 12  # R: window starting the month after the point
delta = 0.3  # alert if recent_mean <= baseline_mean - delta (stars)
persistence = 3  # P: consecutive evaluable points with the condition true
max_gap = 3  # G: > G consecutive unevaluable points close an episode
recovery_points = 2  # K: consecutive evaluable false points close an episode

min_reviews = 20  # per window
min_active_months = 3  # per window (months with >= 1 review)
unevaluable_resets_persistence = true

[reproduction]
metric_tolerance = 1e-9            # pandas reproduction vs Spark, absolute, on means/shares

# ------------------------------------------------------------------ calibration ----
# The protocol `GOLD_CALIBRATION` runs under (ADR-0001, ADR-0011; RR-09 rounds 4-5, RR-13).
# Committed before the producer runs, so the history shows the bar preceded the measurement.
# A rule that fails this must not be frozen -- and RR-09 round 5 forbids the obvious escape:
# if nothing reaches power under an honest ceiling, the ceiling stays and the shortfall is
# reported, routed through the investigate/watchlist split. The ceiling never moves to buy a
# pass.
#
# Supersedes the block added in 6178411, which cited ADR-0012 -- a document that does not
# exist -- set the ceiling as a share of permuted spines rather than the investigation load
# the capacity argument is stated in, and injected 0.5 stars where RR-09 round 5 fixed 0.3 as
# primary. Nothing read it. Both corrections make the bar harder, which is the point: the bar
# was not chosen by looking at which one the rule would clear.
#
# Placebo null: each product's monthly aggregates are cut into blocks of `placebo_block_months`
# and the blocks are circularly rotated and shuffled. Volume, seasonality and dependence
# shorter than a block survive; trend longer than a block does not. Under that null there is
# no sustained decline to find, so every alert is a placebo trigger.
#
# Power: reviews inside a product's own history are relabelled downward from a drawn eligible
# month so its mean falls by `effects` stars -- timestamps, volume, verification and identity
# untouched -- and the rule is re-run over the altered spine.

[calibration]
# The ceiling, in the unit the persona argument is stated in: a category manager has capacity
# for 4 new investigations a month and at most a quarter of them may be noise (RR-09 round 5).
ceiling_alerts_per_month = 1.0
power_target = 0.80                # share of delivered injections detected in the window
primary_effect = 0.3               # stars; the effect the power bar is stated at
primary_mechanism = "severe"       # 5-star reviews relabelled to 1-2 stars
effects = [0.2, 0.3, 0.5]          # the predeclared effect grid; all three reported
mechanisms = ["severe", "moderate"]  # severe = 5 -> 1|2, moderate = 5 -> 3
detection_window_points = 6        # evaluable points, from the first point that can see it
# Injection shape. RR-09 round 5 states the power bar at the *step* and keeps the ramp as a
# reported figure -- "ramp reported, not required to match" -- because a decline that arrives
# over six months is a strictly harder thing to catch inside a fixed horizon, and scoring the
# bar against it would be measuring a different claim. 1 = pure step; 6 = linear over six
# months to the same terminal size, then it persists.
ramps = [1, 6]
primary_ramp_months = 1
placebo_replicates = 24            # permutation draws, seeded
placebo_block_months = 6           # block length, = baseline_months, so a window's worth holds
injection_replicates = 3           # redraws of the injection month and of which rows take it
seed = 20260914

# The candidate grid. Calibration varies these and holds every other [rule] field fixed, so a
# frozen rule differs from the provisional one in named ways only. The selection rule is
# committed here too, in `src/gold/calibration.py:select`: admissible = under the ceiling;
# winner = highest power at the primary effect, ties to the lower median delay, then to the
# larger delta and the longer persistence -- the more conservative rule.
[calibration.grid]
baseline_months = [6, 12]
recent_months = [6, 12]
delta = [0.3, 0.5, 0.75, 1.0]
persistence = [2, 3, 4]
min_reviews = [10, 20, 40]

# Frozen 2026-09-14 by scripts/freeze_rule.py from eval/gold_calibration/gate.json.
# The values above are the configuration calibration chose; they do not move again (ADR-0001).
# Power shortfall accepted: power at the primary effect was 0.18574 against a target of 0.8; the ceiling was held rather than weakened (RR-09 round 5), and the shortfall is published in the evaluation table's verdict column
