# Decline rule configuration (ADR-0001, RR-09). Read by src/gold/rule.py.
#
# status = "provisional" : values are placeholders while the rule is developed on pre-2020
#                          data only; the gold job refuses to evaluate any point on or after
#                          holdout_start.
# status = "frozen"      : the protocol freeze. Set in one commit, after the calibration
#                          lines (placebo trigger rate, injected-decline power) are printed
#                          from pre-2020 data; never edited afterwards.
#
# The SHA-256 of this file's [rule] table is printed by every gold run and stored in the
# run ledger, so a changed rule is visible in lineage.

[rule]
status = "provisional"
holdout_start = "2020-01"          # first holdout evaluation point (month)

baseline_months = 6                # B: trailing window ending at the evaluation point
recent_months = 6                  # R: window starting the month after the point
delta = 0.3                        # alert if recent_mean <= baseline_mean - delta (stars)
persistence = 2                    # P: consecutive evaluable points with the condition true
max_gap = 3                        # G: > G consecutive unevaluable points close an episode
recovery_points = 2                # K: consecutive evaluable false points close an episode

min_reviews = 10                   # per window
min_active_months = 3              # per window (months with >= 1 review)
unevaluable_resets_persistence = true

[reproduction]
metric_tolerance = 1e-9            # pandas reproduction vs Spark, absolute, on means/shares

# Calibration targets (ADR-0001, ADR-0011, ADR-0012). Chosen by convention BEFORE the
# calibration is run and committed ahead of the producer, so the history shows the bar
# preceded the measurement. `GOLD_CALIBRATION` FAILs if the placebo rate exceeds the ceiling
# or the power falls below the target; the rule may not then be retuned to clear them
# without saying so, because `status = "frozen"` comes after this and never moves.
#
# Placebo: a product's calendar spine is permuted in month order within the product,
# preserving every month's review count and rating distribution and destroying only the
# temporal ordering the rule looks for. Under that null there is no sustained decline to
# find, so any alert is a false positive (ADR-0012).
#
# Power: a product the rule does not fire on is given an injected step decline of
# `injected_delta` stars beginning at a uniformly drawn evaluable month, and the rule is
# re-run over the altered spine.

[calibration]
placebo_ceiling = 0.05             # max share of permuted spines on which an alert fires
power_target = 0.80                # min share of injected declines the rule detects
injected_delta = 0.5               # stars, the injected step (> [rule] delta = 0.3)
draws = 1000                       # permutations / injections, seeded
seed = 20260914
