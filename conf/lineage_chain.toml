# The declared chain: every capability the submission claims, in ADR-fixed phase order,
# and every edge between the jobs those capabilities rest on.
#
# Two commands read this file and nothing else decides what the submission contains:
#   * `make eval-table` renders one row per capability from eval/<id>/gate.json;
#   * `scripts/gate_lineage.py` walks the same list and checks every named ledger job
#     back to the pipeline_runs row that produced it.
#
# `jobs` is load-bearing twice over: the lineage gate pins one ledger run per named job and
# refuses an artefact filed under a capability that does not declare the job that produced it,
# and every phase gate prints `run_contract_registered` for these jobs and fails without them.
#
# A capability is either a number or a written reason. `status = "declared"` means its
# artefact must exist and validate -- a missing one exits the table non-zero.
# `status = "cut"` requires a `cut_reason`, renders NOT_RUN, and does not fail the command.
# "not reached by submission date" is a legitimate reason and is written as such (ADR-0011).

version = "1"

# --------------------------------------------------------------------- P2 Silver ----
[[capability]]
id = "silver"
phase = "P2 Silver"
gate_name = "SILVER_GATE"
kind = "reproducibility"
status = "declared"
# The catalogue loader is P2's other job: its run id *is* the catalogue_load_id stamped on
# every products row and named by silver's join (ADR-0007), so the phase claims both.
jobs = ["silver", "catalogue_load"]

[[capability]]
id = "silver_repro"
phase = "P2 Silver"
gate_name = "SILVER_REPRO_GATE"
kind = "reproducibility"
status = "declared"
jobs = ["silver"]

# ----------------------------------------------------------------------- P3 Gold ----
[[capability]]
id = "gold"
phase = "P3 Gold"
gate_name = "GOLD_GATE"
kind = "reproducibility"
status = "declared"
jobs = ["gold"]

[[capability]]
id = "gold_repro"
phase = "P3 Gold"
gate_name = "GOLD_REPRO_GATE"
kind = "reproducibility"
status = "declared"
jobs = ["gold"]

[[capability]]
id = "gold_calibration"
phase = "P3 Gold"
gate_name = "GOLD_CALIBRATION"
kind = "quality"
status = "declared"
jobs = ["gold"]

[[capability]]
id = "gold_analytical"
phase = "P3 Gold"
gate_name = "GOLD_ANALYTICAL"
kind = "quality"
status = "declared"
jobs = ["gold"]

# --------------------------------------------------------------------- P4 Search ----
[[capability]]
id = "search"
phase = "P4 Search"
gate_name = "SEARCH_GATE"
kind = "reproducibility"
status = "declared"
jobs = ["search_index_reviews", "search_index_product_month"]

# ----------------------------------------------------------------- P5 Embeddings ----
[[capability]]
id = "embeddings"
phase = "P5 Embeddings"
gate_name = "EMBED_GATE"
kind = "reproducibility"
status = "declared"
jobs = ["embeddings", "search_index_reviews"]

# --------------------------------------------------------------------- P6 Themes ----
[[capability]]
id = "themes"
phase = "P6 Themes"
gate_name = "THEMES_GATE"
kind = "reproducibility"
status = "declared"
jobs = ["theme_samples", "theme_labels_llm", "theme_labels_reference"]

[[capability]]
id = "themes_quality"
phase = "P6 Themes"
gate_name = "THEMES_QUALITY"
kind = "quality"
status = "declared"
# The published P6 quality number is a three-way comparison (ADR-0002): the labeller, the MLlib
# classifier and the star-only floor, scored on one audit pass. The classifier is an evaluation
# row rather than a capability with a bar of its own, so its two runs are claimed here -- the
# table it appears in is this one, and a claimed job with no successful run fails the chain.
jobs = ["theme_labels_llm", "theme_classifier_train", "theme_classifier_score"]

[[capability]]
id = "themes_agreement"
phase = "P6 Themes"
gate_name = "THEMES_AGREEMENT"
kind = "quality"
status = "declared"
jobs = ["theme_labels_reference"]

[[capability]]
id = "themes_repeat_kappa"
phase = "P6 Themes"
gate_name = "THEMES_REPEAT_KAPPA"
kind = "quality"
status = "cut"
cut_reason = "the labeller is deterministic (temperature 0, fixed seed), so a repeat-run kappa measures nothing; the published agreement number is THEMES_AGREEMENT (ADR-0011, RR-21)"

# ------------------------------------------------------------------------ P7 RAG ----
[[capability]]
id = "rag"
phase = "P7 RAG"
gate_name = "RAG_GATE"
kind = "reproducibility"
status = "declared"
jobs = ["rag_answers"]

[[capability]]
id = "rag_quality"
phase = "P7 RAG"
gate_name = "RAG_QUALITY"
kind = "quality"
status = "declared"
# The quality artefact names the judging run: Philip's pass over the thirty is a ledger job
# (`rag_judgements`, ticket 13) exactly as his 50 are (`theme_labels_human`), and its input
# joins to the `rag_answers` run whose bytes were judged.
jobs = ["rag_answers", "rag_judgements"]

# --------------------------------------------------------------------- P8 Stream ----
[[capability]]
id = "stream_control"
phase = "P8 Stream"
gate_name = "STREAM_GATE"
kind = "reproducibility"
status = "declared"
# All three P8 jobs, because the control run's claim rests on all three: the sort produced the
# event order, the replay carried it onto the topic in that order, and the projection
# aggregated it under the watermark. A claim that named only the projection would leave the
# order -- the premise of every watermark number -- outside the chain.
jobs = ["sort_replay", "stream_produce", "stream_aggregate"]

[[capability]]
id = "stream_demo"
phase = "P8 Stream"
gate_name = "STREAM_GATE"
kind = "reproducibility"
status = "declared"
# The same three jobs as the control run, on the demo topic with the held-back slices
# released late (ticket 16). The demo's gate also requires the control artefact above to be
# present and passing under the same protocol hash: two runs, or neither means anything.
jobs = ["sort_replay", "stream_produce", "stream_aggregate"]

# --------------------------------------------------------------- Lineage track ----
[[capability]]
id = "lineage"
phase = "Lineage track"
gate_name = "LINEAGE_GATE"
kind = "reproducibility"
status = "declared"
jobs = []

# ---------------------------------------------------------- Deliverables track ----
[[capability]]
id = "demo"
phase = "Deliverables track"
gate_name = "DEMO_GATE"
kind = "reproducibility"
status = "declared"
jobs = []

# ============================================================== The declared edges ====
#
# One edge per (downstream job, input name) that names an upstream run: the input entry the
# downstream job recorded carries the upstream's `run_id` (or, for the catalogue, the
# `catalogue_load_id` that *is* its run id). `scripts/gate_lineage.py` checks the join in both
# directions -- an undeclared edge found in the ledger fails just as loudly as a declared edge
# the ledger does not show, so this list cannot quietly fall behind the pipeline.
#
# `spec_version` narrows an edge to one contract version; without it the edge is expected of
# every version. `status = "cut"` names a link the submission does not claim, with the reason
# written out; the identity is still checked for existence as an unjoined input, so cutting an
# edge never makes it an unchecked one.
#
# `upstream_pin` says which run of the upstream job the edge may name. The default `chain` is
# strict -- the run the chain pins for that job -- and catches a downstream built on a stale
# branch. `upstream_pin = "recorded"` lets the downstream choose, for a job that has several
# live outputs at once, and then `pin_reason` is mandatory and is printed by the gate: the
# recorded run is pinned and walked beside the published one, so the weaker check buys more
# checking rather than less (ticket 10a).
#
# Not edges: `theme_classifier_train`/`theme_classifier_score` consume a labels table and a
# model path rather than a named run. They appear in `themes_quality`'s `jobs` above and are
# pinned as runs; they contribute outputs, not joins. `rag_answers` was listed here too, on
# the reading that it had no ledger-run input; the ledger disagreed -- it records the search
# generation it retrieved from -- and the gate caught the omission, so the edge is declared
# below rather than the absence asserted here.

[[edge]]
downstream = "rag_answers"
input = "search"
upstream = "search_index_reviews"
status = "declared"
# The answerer retrieves from the `reviews` alias, so the generation behind that alias is a
# real input: a run answered against an index it can name. The default `chain` pin is right
# here -- one generation is live at a time, and it is the run SEARCH_GATE published.

[[edge]]
downstream = "rag_judgements"
input = "answers"
upstream = "rag_answers"
# The judgement names the answers run by id and by the answers file's sha256; the join is on
# the digest the two rows both record, so a judgement of run 1's bytes cannot be filed
# against run 2 (ticket 13).

[[edge]]
downstream = "silver"
input = "bronze"
upstream = "bronze_drain"
status = "cut"
cut_reason = "the streaming drain writes no ledger row -- ADR-0008 §3 defers producer and bronze instrumentation to their own session -- so silver's bronze snapshot is checked as an Iceberg identity that still exists, but is not joined to a producing run"

[[edge]]
downstream = "silver"
input = "catalogue"
upstream = "catalogue_load"
status = "declared"

[[edge]]
downstream = "gold"
input = "silver"
upstream = "silver"
status = "declared"

[[edge]]
downstream = "embeddings"
input = "silver"
upstream = "silver"
status = "declared"

[[edge]]
downstream = "search_index_reviews"
input = "silver"
upstream = "silver"
status = "declared"

[[edge]]
downstream = "search_index_reviews"
input = "embeddings"
upstream = "embeddings"
spec_version = "2"
status = "declared"

[[edge]]
downstream = "search_index_product_month"
input = "gold"
upstream = "gold"
status = "declared"

[[edge]]
downstream = "theme_samples"
input = "gold"
upstream = "gold"
status = "declared"
upstream_pin = "recorded"
pin_reason = "P6's frames were drawn on 2026-09-07 from gold run 4cd1fde7; P3 publishes the later 6e1c0d3a, whose GOLD_REPRO_GATE re-derives the same three tables from the same silver snapshot. Redrawing the frames against a run that reproduces the one they used would move a frozen sample for no gain (ticket 09: inference may repeat, measurement may not), so this edge names the run the draw recorded and that run is walked beside the published one"

[[edge]]
downstream = "theme_samples"
input = "silver"
upstream = "silver"
status = "declared"

[[edge]]
downstream = "theme_labels_llm"
input = "samples"
upstream = "theme_samples"
status = "declared"
upstream_pin = "recorded"
pin_reason = "theme_samples draws one frame per run -- discovery, development, audit, training_pool -- so several of its outputs are live at once and the latest is not the right one for any particular labelling run. The frame a run read is the one it recorded, and the audit frame is sealed (ticket 09), so the recorded run is the only correct pin"

[[edge]]
downstream = "theme_labels_llm"
input = "silver"
upstream = "silver"
status = "declared"

[[edge]]
downstream = "theme_labels_reference"
input = "samples"
upstream = "theme_samples"
status = "declared"
upstream_pin = "recorded"
pin_reason = "the reference labels are written blind against one frame (RR-21); like the labeller's edge above, the frame it read is the run it recorded, not whichever frame was drawn last"

[[edge]]
downstream = "theme_labels_reference"
input = "silver"
upstream = "silver"
status = "declared"

[[edge]]
downstream = "stream_aggregate"
input = "replay"
upstream = "stream_produce"
status = "declared"
upstream_pin = "recorded"
pin_reason = "P8 runs the replay twice -- the control run on reviews.stream and the demo run on reviews.stream.demo with the late slices held back (ticket 16) -- so two stream_produce outputs are live at once and the later one is not the right upstream for the control projection. Each projection names the replay whose topic it read, and both replays are walked: the control aggregate would otherwise fail against the demo replay it never consumed"

[[edge]]
downstream = "stream_aggregate"
input = "source"
upstream = "sort_replay"
status = "declared"

# The replay reads a file, not a run, so the join is the file's identity: the producer records
# the path and sha256 it sent and the sort job records the path and sha256 it wrote. That is
# the whole point of splitting the two jobs (ticket 14) -- event order is a property of a
# named artefact, so a replay can say which ordering it carried.
[[edge]]
downstream = "stream_produce"
input = "source"
upstream = "sort_replay"
spec_version = "2"
status = "declared"

[[edge]]
downstream = "stream_produce"
input = "source"
upstream = "sort_replay"
spec_version = "3"
status = "declared"

# ================================================= How a table says who wrote it ====
#
# ADR-0008 asks every Iceberg snapshot to carry the producing `run_id` in its snapshot
# summary, and every writer that reaches the table through `writeTo` stamps it that way
# (`src/spark/silver.py`, `src/spark/theme_samples.py`). One table cannot: three writers reach
# `gold.review_theme_labels` through `MERGE INTO`, where the `snapshot-property.run_id` write
# option has no equivalent on the SQL path.
#
# Provenance is not lost there -- every row carries `run_id` as a column -- so the fix is to
# name the mechanism rather than to skip the check, or to re-run hours of inference for the
# sake of a snapshot property (ticket 09: inference may repeat, measurement may not). A table
# declared here is checked by counting the rows the run wrote: at its own snapshot, and still
# at the table head.
#
# The declaration also settles what `current` can mean on a table with several writers. A
# single-writer table's output is current when its snapshot is the table head; on a shared
# table the head belongs to whoever wrote last, so the honest question is whether the run's
# own rows are still there. The tables below are shared: three label sources MERGE into one
# labels table, and `theme_samples` writes one frame per run into one assignments table.
# Where the writer could stamp the snapshot summary it still must -- the column answers
# `current`, never `stamped`.

[[attribution]]
table = "lake.gold.review_theme_labels"
mechanism = "column"
column = "run_id"
reason = "three writers MERGE INTO this table (ADR-0003), and Iceberg's snapshot-property write option does not exist on the SQL path; every row carries run_id as a column instead (src/ai/theme_labels.py:48), so the run's rows are counted at its snapshot and at the table head"

[[attribution]]
table = "lake.gold.theme_sample_assignments"
mechanism = "column"
column = "run_id"
reason = "one frame per run lives in this table at once -- discovery, development, audit, training_pool, each written to its own partition -- so the head belongs to the frame drawn last and no frame's snapshot stays the head. The writer stamps the snapshot summary (src/spark/theme_samples.py:394), which still answers who wrote it; the column answers whether the frame's rows are still there"

[[attribution]]
table = "lake.gold.matched_controls"
mechanism = "column"
column = "run_id"
reason = "written beside the assignments by the same per-frame job and shared the same way, so the same two questions get the same two answers"
