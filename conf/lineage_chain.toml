# The declared chain: every capability the submission claims, in ADR-fixed phase order,
# and every edge between the jobs those capabilities rest on.
#
# Two commands read this file and nothing else decides what the submission contains:
#   * `make eval-table` renders one row per capability from eval/<id>/gate.json;
#   * `scripts/gate_lineage.py` walks the same list and checks every named ledger job
#     back to the pipeline_runs row that produced it.
#
# `jobs` is load-bearing twice over: the lineage gate pins one ledger run per named job and
# refuses an artefact filed under a capability that does not declare the job that produced it,
# and every phase gate prints `run_contract_registered` for these jobs and fails without them.
#
# A capability is either a number or a written reason. `status = "declared"` means its
# artefact must exist and validate -- a missing one exits the table non-zero.
# `status = "cut"` requires a `cut_reason`, renders NOT_RUN, and does not fail the command.
# "not reached by submission date" is a legitimate reason and is written as such (ADR-0011).

version = "1"

# --------------------------------------------------------------------- P2 Silver ----
[[capability]]
id = "silver"
phase = "P2 Silver"
gate_name = "SILVER_GATE"
kind = "reproducibility"
status = "declared"
# The catalogue loader is P2's other job: its run id *is* the catalogue_load_id stamped on
# every products row and named by silver's join (ADR-0007), so the phase claims both.
jobs = ["silver", "catalogue_load"]

[[capability]]
id = "silver_repro"
phase = "P2 Silver"
gate_name = "SILVER_REPRO_GATE"
kind = "reproducibility"
status = "declared"
jobs = ["silver"]

