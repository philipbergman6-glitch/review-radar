[project]
name = "review-radar"
version = "0.1.0"
description = "Streaming review intelligence: Kafka -> Spark -> Iceberg/MinIO -> Elasticsearch, with in-pipeline AI enrichment, semantic search and RAG."
requires-python = ">=3.11,<3.12"
dependencies = [
    # --- pipeline ---
    "pyspark==3.5.3",
    "confluent-kafka>=2.6.0",
    "orjson>=3.10",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    # --- storage / serving ---
    "elasticsearch>=8.15,<9",
    "psycopg[binary]>=3.2",
    "boto3>=1.35",
    # --- analysis ---
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    # --- AI ---
    "sentence-transformers>=3.2",
    "anthropic>=0.40",
    # --- app ---
    "streamlit>=1.39",
    "plotly>=5.24",
]

[dependency-groups]
dev = ["jupyter>=1.1", "ipykernel>=6.29", "ruff>=0.7", "pytest>=8.3"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
